[theme]
base = "dark"
primaryColor = "#00CC99"
backgroundColor = "#0D0F12"
secondaryBackgroundColor = "#16191E"
textColor = "#F5F6F7"
font = "sans serif"
baseFontSize = 17

[theme.light]
primaryColor = "#006B4F"
backgroundColor = "#F3F5F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0D0F12"

[client]
toolbarMode = "minimal"

[server]
# Serves app/static (Manrope woff2 + OFL) at /app/static/. The demo stays offline.
enableStaticServing = true

[browser]
gatherUsageStats = false
